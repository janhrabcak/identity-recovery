name: Deploy Web Platform to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tools/**'
      - 'scripts/build-site.js'
      - 'scripts/build-builder.js'
      - 'scripts/deploy-site.sh'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy idrecoverykit.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integrity & Cryptographic Tests
        run: npm test

      - name: Build Web Application & Edge Headers
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Checking Accessible Cloudflare Pages Projects ==="
          npx wrangler pages project list || true
          echo "=== Ensuring Cloudflare Pages Project Exists ==="
          npx wrangler pages project create idrecoverykit --production-branch=main || true
          echo "=== Deploying site to Cloudflare Pages ==="
          npx wrangler pages deploy site --project-name=idrecoverykit --branch=main --commit-dirty=true
