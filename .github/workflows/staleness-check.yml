name: Recovery Vault Staleness Monitor

'on':
  schedule:
    # Runs at 09:00 UTC on the 1st and 15th of every month
    - cron: '0 9 1,15 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/index.html'
      - 'scripts/check-staleness.js'
      - '.github/workflows/staleness-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-staleness:
    name: Evaluate Vault Freshness and Manage Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Staleness Check & Update Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-staleness.js --manage-issue
