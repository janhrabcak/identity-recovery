name: Recovery Vault Staleness Monitor

on:
  schedule:
    # Runs at 09:00 UTC on the 1st and 15th of every month
    - cron: '0 9 1,15 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/index.html'
      - 'scripts/check-staleness.js'
      - '.github/workflows/staleness-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-staleness:
    name: Check Recovery Vault Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Staleness Evaluation
        id: staleness
        run: node scripts/check-staleness.js

      - name: Process Staleness Alert & Manage GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.staleness.outputs.status }}
          DAYS: ${{ steps.staleness.outputs.days_remaining }}
          GEN_DATE: ${{ steps.staleness.outputs.generated_at }}
          EXPIRE_DATE: ${{ steps.staleness.outputs.expire_date }}
          LIMIT: ${{ steps.staleness.outputs.stale_after_months }}
          DIFF_DAYS: ${{ steps.staleness.outputs.diff_days }}
          DIFF_MONTHS: ${{ steps.staleness.outputs.diff_months }}
        run: |
          echo "Status: $STATUS"
          echo "Days Remaining: $DAYS"
          echo "Generated At: $GEN_DATE"
          echo "Deadline: $EXPIRE_DATE"

          # Query for any open issue labeled 'vault-staleness'
          EXISTING_ISSUE=$(gh issue list --label "vault-staleness" --state open --json number --jq '.[0].number')

          if [ "$STATUS" = "EXPIRING_SOON" ] || [ "$STATUS" = "STALE" ]; then
            if [ "$STATUS" = "STALE" ]; then
              TITLE="🚨 CRITICAL: Identity Recovery Vault is STALE (Expired on $EXPIRE_DATE)"
              SEVERITY="CRITICAL ALERT"
            else
              TITLE="⚠️ WARNING: Identity Recovery Vault expiring in $DAYS days (Rotate by $EXPIRE_DATE)"
              SEVERITY="EXPIRING SOON WARNING"
            fi

            BODY="## $SEVERITY: Action Required

Your cold-start identity recovery vault has reached or is approaching its **$LIMIT-month freshness limit**.

- **Vault Generated:** \`$GEN_DATE\` ($DIFF_DAYS days ago / ~$DIFF_MONTHS months)
- **Staleness Threshold:** **$LIMIT Months**
- **Expiration Deadline:** \`$EXPIRE_DATE\`
- **Days Remaining:** **$DAYS days**
- **Freshness Status:** **$STATUS**

---

### 🛡️ Why This Matters
In a physical disaster scenario (lost phone, lost YubiKey, lost wallet), stale Google 2SV backup codes or outdated 1Password secret keys will lead to permanent lockout.

### 📋 Recommended Rotation Steps:
1. Generate new Google 2SV backup codes and verify your 1Password credentials.
2. Run the automated deployment script on your trusted machine:
   \`\`\`bash
   ./scripts/deploy.sh payload.json
   \`\`\`
3. Committing and pushing the updated vault will automatically trigger Cloudflare edge deployment and **automatically resolve/close this issue**.

---
*Generated by automated Identity Recovery Protocol Monitor.*"

            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Updating existing open issue #$EXISTING_ISSUE..."
              gh issue edit "$EXISTING_ISSUE" --title "$TITLE" --body "$BODY"
              gh issue comment "$EXISTING_ISSUE" --body "⏱️ **Staleness Reminder:** Current status is **$STATUS** with **$DAYS days** remaining until expiration (\`$EXPIRE_DATE\`)."
            else
              echo "Creating new staleness alert issue..."
              gh issue create --title "$TITLE" --body "$BODY" --label "vault-staleness"
            fi
          elif [ "$STATUS" = "FRESH" ]; then
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Closing resolved issue #$EXISTING_ISSUE..."
              gh issue close "$EXISTING_ISSUE" --comment "✓ **Resolved:** Recovery vault was rotated on \`$GEN_DATE\`. Current vault is **FRESH** ($DAYS days remaining until staleness threshold). Closing alert."
            else
              echo "Vault is fresh ($DAYS days remaining). No open issues to resolve."
            fi
          fi
